<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Produtos PetCare</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    main { background: var(--bg-page); padding: 48px 0; min-height: 60vh; }

    .admin-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 32px;
      align-items: start;
    }

    .form-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-sm);
      padding: 28px;
      position: sticky;
      top: 80px;
    }

    .form-card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modo-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: var(--blue-light);
      color: var(--blue);
    }

    .modo-badge.editando {
      background: #FEF3C7;
      color: #92400E;
    }

    form .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .img-preview {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: var(--radius-md);
      background: var(--gray-100);
      display: none;
      margin-bottom: 12px;
    }

    .img-preview.visivel { display: block; }

    .btns-form { display: flex; gap: 8px; margin-top: 6px; }
    .btns-form .btn { flex: 1; justify-content: center; }

    .btn.perigo { background: #FEE2E2; color: #DC2626; border: none; }
    .btn.perigo:hover { background: #FECACA; }

    .table-card {
      background: var(--bg-white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-100);
    }

    .table-header h2 { font-size: 17px; }

    .contador {
      background: var(--blue-light);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      margin-left: 8px;
    }

    .busca-wrap { position: relative; }
    .busca-wrap .icone {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: 14px; pointer-events: none;
    }
    .busca-wrap input {
      padding: 8px 14px 8px 34px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-pill);
      font-family: var(--font); font-size: 13px;
      outline: none; width: 200px; transition: border-color .2s;
    }
    .busca-wrap input:focus { border-color: var(--blue); }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 12px 16px; text-align: left;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--gray-400); background: var(--gray-50);
      border-bottom: 1px solid var(--gray-100);
    }

    tbody tr { border-bottom: 1px solid var(--gray-100); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--gray-50); }

    td { padding: 12px 16px; font-size: 14px; vertical-align: middle; }

    .td-img { width: 52px; height: 52px; object-fit: cover; border-radius: var(--radius-md); }
    .td-nome { font-weight: 600; }
    .td-preco { font-weight: 700; color: var(--green-dark); white-space: nowrap; }
    .td-acoes { display: flex; gap: 6px; }

    .btn-editar {
      background: var(--blue-light); color: var(--blue);
      border: none; padding: 5px 12px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: var(--font); transition: background .15s;
    }
    .btn-editar:hover { background: #BFDBFE; }

    .btn-excluir {
      background: #FEE2E2; color: #DC2626;
      border: none; padding: 5px 12px; border-radius: var(--radius-pill);
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: var(--font); transition: background .15s;
    }
    .btn-excluir:hover { background: #FECACA; }

    .vazio { text-align: center; padding: 48px 20px; color: var(--gray-400); font-size: 14px; }
    .vazio .icon { font-size: 40px; margin-bottom: 12px; }

    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
      .form-card  { position: static; }
    }
  </style>
</head>
<body>

<section class="page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="../index.html">Início</a> / Admin / Produtos</p>
    <h1>⚙️ Gerenciar Produtos</h1>
    <p>Adicione, edite e remova produtos.</p>
  </div>
</section>

<main>
  <div class="container">
    <div class="admin-grid">

      <!-- FORMULÁRIO -->
      <div>
        <div class="form-card">
          <div class="form-card-title">
            <span id="form-icone">➕</span>
            <span id="form-titulo">Novo Produto</span>
          </div>

          <img id="img-preview" class="img-preview" src="" alt="Preview">

          <form id="form-produto" autocomplete="off">
            <input type="hidden" id="produto-id">

            <div class="form-group">
              <label>Nome do produto</label>
              <input type="text" id="nome" placeholder="Ex: Ração Premium Adulto" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Preço (R$)</label>
                <input type="number" id="preco" placeholder="0.00" min="0" step="0.01" required>
              </div>
              <div class="form-group">
                <label>Estoque</label>
                <input type="number" id="estoque" placeholder="0" min="0" value="0" required>
              </div>
            </div>

            <div class="form-group">
              <label>Categoria</label>
              <select id="cat" required>
                <option value="">Selecione...</option>
                <option value="alimentacao">🥣 Alimentação</option>
                <option value="brinquedos">🎾 Brinquedos</option>
                <option value="acessorios">🎀 Acessórios</option>
                <option value="higiene">🛁 Higiene</option>
                <option value="saude">💊 Saúde</option>
              </select>
            </div>

            <div class="form-group">
              <label>Caminho da imagem</label>
              <input type="text" id="img" placeholder="images/produto1.png"
                     oninput="atualizarPreview(this.value)">
            </div>

            <div class="form-group">
              <label>Descrição</label>
              <textarea id="descricao" placeholder="Descreva o produto..."
                        style="min-height:80px; resize:vertical;"></textarea>
            </div>

            <div class="btns-form">
              <button type="submit" class="btn primary" id="btn-salvar">💾 Salvar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- TABELA -->
      <div>
        <div class="table-card">
          <div class="table-header">
            <h2>Produtos <span class="contador" id="contador">0</span></h2>
            <div class="busca-wrap">
              <span class="icone">🔍</span>
              <input type="text" id="busca-tabela" placeholder="Buscar..."
                     oninput="filtrarTabela(this.value)">
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Img</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="../js/storage.js"></script>
<script src="../js/main.js"></script>
<script>

  function resolveImg(src) {
    if (!src) return '../images/produto1.png';
    if (src.startsWith('http') || src.startsWith('../') || src.startsWith('/')) return src;
    return '../' + src;
  }

  const KEY = 'petcare_produtos';

  const CAT_LABEL = {
    alimentacao: 'Alimentação',
    brinquedos:  'Brinquedos',
    acessorios:  'Acessórios',
    higiene:     'Higiene',
    saude:       'Saúde',
  };

  let todosProdutos = [];

  /* ── CARREGAR E RENDERIZAR ──────────────────────────────── */
  function carregarProdutos() {
    todosProdutos = Storage.getList(KEY);
    renderizarTabela(todosProdutos);
  }

  function renderizarTabela(lista) {
    const corpo    = document.getElementById('tabela-corpo');
    document.getElementById('contador').textContent = lista.length;

    if (!lista.length) {
      corpo.innerHTML = `
        <tr><td colspan="6">
          <div class="vazio">
            <div class="icon">📦</div>
            <p>Nenhum produto ainda.<br>Use o formulário ao lado para adicionar.</p>
          </div>
        </td></tr>`;
      return;
    }

    corpo.innerHTML = lista.map(p => `
      <tr>
        <td><img class="td-img" src="${resolveImg(p.img)}" alt="${p.nome}"
                 onerror="this.src='../images/produto1.png'"></td>
        <td class="td-nome">${p.nome}</td>
        <td><span class="badge">${CAT_LABEL[p.cat] || p.cat}</span></td>
        <td class="td-preco">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</td>
        <td>${p.estoque ?? 0}</td>
        <td>
          <div class="td-acoes">
            <button class="btn-editar" onclick="carregarEdicao(${p.id})">✏️ Editar</button>
            <button class="btn-excluir" onclick="excluirProduto(${p.id}, '${p.nome.replace(/'/g,"\\'")}')">🗑 Excluir</button>
          </div>
        </td>
      </tr>`).join('');
  }

  /* ── BUSCA ──────────────────────────────────────────────── */
  function filtrarTabela(termo) {
    const resultado = todosProdutos.filter(p =>
      p.nome.toLowerCase().includes(termo.toLowerCase()) ||
      (CAT_LABEL[p.cat] || '').toLowerCase().includes(termo.toLowerCase())
    );
    renderizarTabela(resultado);
  }

  /* ── PREVIEW DA IMAGEM ──────────────────────────────────── */
  function atualizarPreview(src) {
    const el = document.getElementById('img-preview');
    if (src) {
      el.src = resolveImg(src);
      el.classList.add('visivel');
      el.onerror = () => el.classList.remove('visivel');
    } else {
      el.classList.remove('visivel');
    }
  }

  /* ── SALVAR (criar ou editar) ───────────────────────────── */
  document.getElementById('form-produto').addEventListener('submit', function(e) {
    e.preventDefault();

    const id    = document.getElementById('produto-id').value;
    const catVal = document.getElementById('cat').value;

    const dados = {
      nome:      document.getElementById('nome').value.trim(),
      preco:     parseFloat(document.getElementById('preco').value),
      estoque:   parseInt(document.getElementById('estoque').value) || 0,
      cat:       catVal,
      img:       document.getElementById('img').value.trim() || 'images/produto1.png',
      descricao: document.getElementById('descricao').value.trim(),
      badge:     CAT_LABEL[catVal] || '',
    };

    if (id) {
      /* EDITAR — atualiza pelo id */
      Storage.updateInList(KEY, Number(id), dados);
      mostrarToast('✅ Produto atualizado!', 'success');
    } else {
      /* CRIAR — id gerado automaticamente pelo Storage.addToList */
      Storage.addToList(KEY, dados);
      mostrarToast('✅ Produto cadastrado!', 'success');
    }

    resetForm();
    carregarProdutos();
  });

  /* ── CARREGAR PARA EDIÇÃO ───────────────────────────────── */
  function carregarEdicao(id) {
    const p = Storage.findInList(KEY, id);
    if (!p) return;

    document.getElementById('produto-id').value  = p.id;
    document.getElementById('nome').value        = p.nome;
    document.getElementById('preco').value       = p.preco;
    document.getElementById('estoque').value     = p.estoque ?? 0;
    document.getElementById('cat').value         = p.cat;
    document.getElementById('img').value         = p.img || '';
    document.getElementById('descricao').value   = p.descricao || '';
    atualizarPreview(p.img);

    document.getElementById('form-icone').textContent     = '✏️';
    document.getElementById('form-titulo').textContent    = 'Editar Produto';
    document.getElementById('modo-badge').textContent     = 'EDITANDO';
    document.getElementById('modo-badge').className       = 'modo-badge editando';
    document.getElementById('btn-cancelar').style.display = 'block';

    document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ── EXCLUIR ────────────────────────────────────────────── */
  function excluirProduto(id, nome) {
    if (!confirm(`Excluir "${nome}"?\nEsta ação não pode ser desfeita.`)) return;
    Storage.removeFromList(KEY, id);
    mostrarToast('🗑 Produto excluído', 'info');
    carregarProdutos();
  }

  /* ── RESETAR FORMULÁRIO ─────────────────────────────────── */
  function resetForm() {
    document.getElementById('form-produto').reset();
    document.getElementById('produto-id').value            = '';
    document.getElementById('form-icone').textContent      = '➕';
    document.getElementById('form-titulo').textContent     = 'Novo Produto';
    document.getElementById('modo-badge').textContent      = 'NOVO';
    document.getElementById('modo-badge').className        = 'modo-badge';
    document.getElementById('btn-cancelar').style.display  = 'none';
    document.getElementById('img-preview').classList.remove('visivel');
  }

  carregarProdutos();

</script>
</body>
</html>
