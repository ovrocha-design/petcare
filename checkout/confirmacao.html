<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare - Pedido Confirmado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="confirmacao.css">
</head>
<body>

    <main class="pagina">

        <div class="icone-sucesso">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>Pedido Confirmado!</h1>
        <p class="subtitulo">Obrigado pela sua compra. Seu pedido foi recebido com sucesso!</p>

        <div class="card">

            <div class="numero-pedido">
                <small>Número do Pedido</small>
                <strong id="codigo-pedido">PET-000000</strong>
            </div>

            <div class="info-linha">
                <i class="fa-solid fa-truck" style="color:#2d8cff"></i>
                <div>
                    <span>Previsão de entrega</span>
                    <strong style="color:#2d8cff">3 a 7 dias úteis</strong>
                </div>
            </div>

            <p class="aviso">
                Você receberá atualizações sobre seu pedido por e-mail. Verifique também a caixa de spam.
            </p>

        </div>

        <div class="botoes">
            <a href="../index.html" class="btn-azul">
                <i class="fa-solid fa-box"></i> Voltar para o Início
            </a>
            <a href="../index.html" class="btn-branco">
                <i class="fa-solid fa-cart-shopping"></i> Continuar comprando
            </a>
        </div>

    </main>

    <script src="confirmacao.js"></script>
</body>
</html>
